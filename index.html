<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت فایل گیت‌هاب | ®️SHΞN™ ᴢᴇʀᴏ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-deep: #050507;
            --glass-bg: rgba(20, 22, 26, 0.75);
            --glass-border: rgba(210, 153, 34, 0.3);
            --glass-hover: rgba(30, 35, 42, 0.9);
            --accent: #d29922;
            --accent-hover: #e3a826;
            --accent-glow: rgba(210, 153, 34, 0.5);
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --danger: #f85149;
            --success: #3fb950;
            --info: #58a6ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg-deep) radial-gradient(circle at top, #1a150b 0%, transparent 60%);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        /* Topbar & Collapse Logic */
        .topbar {
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .topbar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .topbar .logo {
            font-weight: 800;
            color: var(--accent);
            font-size: 18px;
            text-shadow: 0 0 12px var(--accent-glow);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            transition: 0.3s;
        }

        .conn-group { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap; 
            margin-top: 16px;
            transition: all 0.3s ease;
            transform-origin: top;
        }
        
        .conn-group.collapsed {
            display: none;
        }

        input, select, textarea {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: auto;
        }
        .btn:hover { background: var(--accent-hover); box-shadow: 0 0 12px var(--accent-glow); }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        /* Main Layout */
        .main { display: flex; flex: 1; overflow: hidden; }
        
        .toolbar {
            width: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            border-left: 1px solid var(--glass-border);
            gap: 12px;
            flex-shrink: 0;
            background: var(--glass-bg);
            z-index: 5;
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            width: 44px; height: 44px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { color: var(--accent); background: rgba(210,153,34,0.1); }
        .separator { width: 40%; height: 1px; background: var(--glass-border); margin: 4px 0; opacity: 0.5; }

        .content { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        .breadcrumb {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            border-bottom: 1px solid rgba(210,153,34,0.15);
            overflow-x: auto;
            white-space: nowrap;
        }
        .breadcrumb::-webkit-scrollbar { display: none; }
        .breadcrumb a { color: var(--text-muted); cursor: pointer; text-decoration: none; }
        .breadcrumb a:hover { color: var(--accent); text-shadow: 0 0 8px var(--accent-glow); }
        .breadcrumb .current { color: var(--text-main); font-weight: 600; }

        .file-list-wrap { flex: 1; overflow-y: auto; padding: 20px; }
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; align-content: start; }
        
        .file-item {
            padding: 16px 12px;
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            cursor: pointer; position: relative; transition: all 0.2s;
        }
        .file-item:hover, .file-item:active { transform: translateY(-3px); border-color: rgba(210, 153, 34, 0.6); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .file-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 15px var(--accent-glow); background: rgba(210,153,34,0.05); }
        
        .file-item .icon { font-size: 44px; margin-bottom: 12px; color: var(--text-muted); }
        .file-item .icon.folder { color: var(--accent); text-shadow: 0 0 10px rgba(210, 153, 34, 0.4); }
        .file-item .name { font-size: 12px; word-break: break-word; line-height: 1.4; }
        
        .checkbox { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; accent-color: var(--accent); opacity: 0; transition: 0.2s; cursor: pointer; }
        .file-item:hover .checkbox, .file-item.selected .checkbox { opacity: 1; }

        .actions-overlay {
            position: absolute; bottom: 8px; display: flex; gap: 6px; opacity: 0; transition: 0.2s;
        }
        .file-item:hover .actions-overlay { opacity: 1; }
        @media (hover: none) { .actions-overlay, .checkbox { opacity: 1; } }

        .actions-overlay button {
            background: rgba(0,0,0,0.85); border: 1px solid var(--glass-border); color: var(--text-main);
            border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: 0.2s;
        }
        .actions-overlay button:hover { background: var(--accent); color: #000; }

        .empty-msg { color: var(--text-muted); text-align: center; padding: 80px 0; font-size: 15px; display: flex; flex-direction: column; gap: 16px; align-items: center; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box { padding: 24px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 20px var(--glass-border); max-height: 90vh; overflow-y: auto;}
        .modal-box h2 { font-size: 18px; margin-bottom: 20px; color: var(--accent); border-bottom: 1px solid var(--glass-border); padding-bottom: 12px;}
        .modal-box label { display: block; margin: 12px 0 8px; font-size: 13px; color: var(--text-muted); }
        .modal-box textarea { min-height: 180px; font-family: monospace; resize: vertical; }
        .modal-box .btn-group { display: flex; gap: 12px; justify-content: flex-end; margin-top: 28px; }

        /* Toast */
        .toast {
            position: fixed; bottom: -80px; right: 50%; transform: translateX(50%); padding: 14px 24px; border-radius: 10px;
            display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.8); white-space: nowrap; width: max-content; max-width: 90vw;
        }
        .toast.show { bottom: 85px; } 
        .toast.error { border: 1px solid var(--danger); background: rgba(248,81,73,0.95); color: #fff; }
        .toast.success { border: 1px solid var(--success); background: rgba(63,185,80,0.95); color: #fff; }
        .toast.info { border: 1px solid var(--info); background: rgba(88,166,255,0.95); color: #fff; }

        /* Mobile Layout tweaks */
        @media (max-width: 768px) {
            .conn-group { flex-direction: column; width: 100%; gap: 12px; }
            .conn-group input, .conn-group select, .conn-group .btn { width: 100% !important; height: 48px; }
            .main { flex-direction: column-reverse; }
            .toolbar {
                width: 100%; height: 70px; flex-direction: row; padding: 0 12px; border-left: none; border-top: 1px solid var(--glass-border);
                justify-content: space-between; overflow-x: auto; background: rgba(10, 12, 16, 0.95); backdrop-filter: blur(20px);
                -webkit-overflow-scrolling: touch;
            }
            .toolbar::-webkit-scrollbar { display: none; }
            .separator { width: 1px; height: 35px; margin: 0; }
            .tool-btn { width: 50px; height: 50px; font-size: 24px; flex-shrink: 0; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
            .file-item { padding: 14px 8px; }
            .file-item .icon { font-size: 38px; }
            .actions-overlay { bottom: 6px; flex-direction: column; gap: 6px; }
            .actions-overlay button { padding: 6px; font-size: 14px; }
            .checkbox { top: 6px; right: 6px; width: 24px; height: 24px; }
        }
    </style>
</head>
<body>

<div class="topbar glass-panel" id="topbar">
    <div class="topbar-header">
        <div class="logo"><i class="fas fa-network-wired"></i> GitFM</div>
        <div class="status" id="connStatus"><i class="fas fa-circle-notch"></i> آفلاین</div>
        <button class="toggle-btn" onclick="toggleConnGroup()" id="toggleBtn"><i class="fas fa-chevron-up"></i></button>
    </div>
    <div class="conn-group" id="connGroup">
        <input type="password" id="token" placeholder="Token (ghp_...)" style="flex: 1; min-width: 150px;">
        <select id="repoSelect" style="flex: 2; min-width: 180px;"><option value="">-- انتخاب مخزن --</option></select>
        <input type="text" id="branch" value="main" placeholder="Branch" style="flex: 1; max-width: 100px; text-align: center;">
        <button class="btn" onclick="connect()"><i class="fas fa-link"></i> اتصال</button>
    </div>
</div>

<div class="main">
    <div class="toolbar glass-panel">
        <button class="tool-btn" onclick="goUp()" title="بازگشت"><i class="fas fa-level-up-alt"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" onclick="newFolderModal()" title="پوشه جدید"><i class="fas fa-folder-plus"></i></button>
        <button class="tool-btn" onclick="document.getElementById('fileUpload').click()" title="آپلود"><i class="fas fa-cloud-upload-alt"></i></button>
        <input type="file" id="fileUpload" multiple style="display:none" onchange="uploadFiles(this.files)">
        <button class="tool-btn" onclick="deleteSelected()" title="حذف"><i class="fas fa-trash"></i></button>
        <button class="tool-btn" onclick="downloadZip()" title="دانلود Zip"><i class="fas fa-file-archive"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" onclick="editSelected()" title="ویرایش"><i class="fas fa-pen"></i></button>
        <button class="tool-btn" onclick="renameSelected()" title="تغییر نام"><i class="fas fa-keyboard"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" onclick="loadCurrentDir()" title="تازه‌سازی"><i class="fas fa-sync"></i></button>
    </div>

    <div class="content">
        <div class="breadcrumb glass-panel" id="breadcrumb"></div>
        <div class="file-list-wrap">
            <div id="fileContainer" class="file-grid"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box glass-panel">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="btn-group" id="modalButtons"></div>
    </div>
</div>

<div class="toast glass-panel" id="toast">
    <i id="toastIcon"></i> <span id="toastMsg"></span>
</div>

<script>
    const PROXY_URL = 'https://superscrap.shervin003254024.workers.dev/';
    let state = { token: '', owner: '', repo: '', branch: 'main', currentPath: '', files: [], selected: new Set() };

    const utf8_to_b64 = (str) => btoa(unescape(encodeURIComponent(str)));
    const b64_to_utf8 = (str) => decodeURIComponent(escape(atob(str)));

    function showToast(msg, type = 'info') {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        t.className = `toast glass-panel show ${type}`;
        document.getElementById('toastIcon').className = type === 'success' ? 'fas fa-check-circle' : type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-info-circle';
        clearTimeout(t.timer);
        t.timer = setTimeout(() => t.classList.remove('show'), 4000);
    }

    function toggleConnGroup(forceCollapse = false) {
        const cg = document.getElementById('connGroup');
        const icon = document.querySelector('#toggleBtn i');
        if (forceCollapse || !cg.classList.contains('collapsed')) {
            cg.classList.add('collapsed');
            icon.className = 'fas fa-chevron-down';
        } else {
            cg.classList.remove('collapsed');
            icon.className = 'fas fa-chevron-up';
        }
    }

    function openModal(title, html, buttons) {
        document.getElementById('modalTitle').innerHTML = title;
        document.getElementById('modalBody').innerHTML = html;
        const btns = document.getElementById('modalButtons');
        btns.innerHTML = '';
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.innerHTML = b.label;
            btn.className = b.class || 'btn-outline btn';
            btn.onclick = b.onclick;
            btns.appendChild(btn);
        });
        document.getElementById('modalOverlay').classList.add('show');
    }
    const closeModal = () => document.getElementById('modalOverlay').classList.remove('show');

    async function ghFetch(endpoint, options = {}) {
        const token = document.getElementById('token').value.trim();
        const headers = {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            ...(options.body ? { 'Content-Type': 'application/json' } : {})
        };

        const directUrl = endpoint.startsWith('http') ? endpoint : `https://api.github.com${endpoint}`;
        const proxyUrl = PROXY_URL + '?url=' + encodeURIComponent(directUrl);

        let errorToThrow;

        try {
            const res = await fetch(proxyUrl, { ...options, headers });
            if (res.ok) return res.status === 204 ? null : await res.json();
            if (res.status === 404) throw new Error('404');
            throw new Error(`Proxy Failed: ${res.status}`);
        } catch (err) {
            if (err.message === '404') throw err;
            errorToThrow = err;
        }

        try {
            const res = await fetch(directUrl, { ...options, headers });
            if (res.ok) return res.status === 204 ? null : await res.json();
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `API Error ${res.status}`);
        } catch (err) {
            throw new Error(errorToThrow ? `ارتباط ناموفق: ${err.message}` : err.message);
        }
    }

    async function connect() {
        const token = document.getElementById('token').value.trim();
        if (!token) return showToast('توکن وارد نشده', 'error');
        state.token = token; localStorage.setItem('token', token);
        
        try {
            showToast('در حال ارتباط با گیت‌هاب...', 'info');
            const repos = await ghFetch('/user/repos?per_page=100&sort=updated');
            const select = document.getElementById('repoSelect');
            select.innerHTML = '<option value="">-- انتخاب مخزن --</option>';
            repos.forEach(r => select.add(new Option(r.name, r.full_name)));
            
            const saved = localStorage.getItem('repo');
            if (saved && repos.find(r => r.full_name === saved)) select.value = saved;
            else if (repos.length) select.value = repos[0].full_name;

            if (select.value) {
                [state.owner, state.repo] = select.value.split('/');
                state.branch = document.getElementById('branch').value.trim() || 'main';
                localStorage.setItem('repo', select.value);
                document.getElementById('connStatus').innerHTML = `<i class="fas fa-check" style="color:var(--success)"></i> متصل: ${state.repo}`;
                toggleConnGroup(true); // Auto collapse topbar on success
                loadCurrentDir();
            }
        } catch (e) {
            showToast('خطا در اتصال: ' + e.message, 'error');
        }
    }

    document.getElementById('repoSelect').addEventListener('change', e => {
        if (!e.target.value) return;
        [state.owner, state.repo] = e.target.value.split('/');
        localStorage.setItem('repo', e.target.value);
        state.currentPath = ''; state.selected.clear();
        loadCurrentDir();
        toggleConnGroup(true); // Collapse after selection
    });

    function updateBreadcrumb() {
        const p = state.currentPath.split('/').filter(x => x);
        let html = `<a onclick="nav('')"><i class="fas fa-home"></i> ریشه</a>`;
        let cur = '';
        p.forEach((part, i) => {
            cur += part + '/';
            html += ` <i class="fas fa-chevron-left" style="font-size:10px;color:var(--glass-border)"></i> `;
            if (i === p.length - 1) html += `<span class="current">${part}</span>`;
            else html += `<a onclick="nav('${cur.slice(0,-1)}')">${part}</a>`;
        });
        document.getElementById('breadcrumb').innerHTML = html;
    }

    function nav(path) { state.currentPath = path; loadCurrentDir(); }
    function goUp() { if (state.currentPath) nav(state.currentPath.split('/').slice(0, -1).join('/')); }

    async function loadCurrentDir() {
        const c = document.getElementById('fileContainer');
        c.innerHTML = '<div class="empty-msg"><i class="fas fa-circle-notch fa-spin fa-3x"></i> در حال دریافت...</div>';
        updateBreadcrumb();
        state.selected.clear();

        try {
            const data = await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${state.currentPath}?ref=${state.branch}&t=${Date.now()}`);
            if (!Array.isArray(data)) throw new Error('این مسیر فایل است');
            state.files = data;
            
            if (data.length === 0) {
                c.innerHTML = '<div class="empty-msg"><i class="fas fa-folder-open fa-3x"></i> پوشه خالی است</div>';
                return;
            }

            data.sort((a, b) => (a.type === 'dir' ? -1 : 1) - (b.type === 'dir' ? -1 : 1) || a.name.localeCompare(b.name));
            
            c.innerHTML = data.map(item => {
                const isDir = item.type === 'dir';
                let icon = isDir ? 'fas fa-folder folder' : 'fas fa-file-alt';
                const ext = item.name.split('.').pop().toLowerCase();
                if (!isDir) {
                    if (['png','jpg','jpeg','svg','gif'].includes(ext)) icon = 'fas fa-image';
                    else if (['mp4','mkv','avi'].includes(ext)) icon = 'fas fa-film';
                    else if (['mp3','wav','ogg'].includes(ext)) icon = 'fas fa-music';
                    else if (['zip','rar','tar','gz'].includes(ext)) icon = 'fas fa-file-archive';
                }
                
                return `
                <div class="file-item glass-panel" data-path="${item.path}" onclick="toggleSelect('${item.path}')">
                    <input type="checkbox" class="checkbox" id="cb-${item.sha}">
                    <i class="${icon} icon"></i>
                    <div class="name">${item.name}</div>
                    <div class="actions-overlay">
                        ${isDir ? `<button onclick="event.stopPropagation(); nav('${item.path}')" title="ورود"><i class="fas fa-sign-in-alt"></i> ورود</button>` : 
                                  `
                                   <button onclick="event.stopPropagation(); forceDownload('${item.path}', '${item.name}')" title="دریافت فایل (اجباری)"><i class="fas fa-download"></i></button>
                                   <button onclick="event.stopPropagation(); copyDownloadLink('${item.path}')" title="کپی لینک دانلود مستقیم"><i class="fas fa-link"></i></button>
                                   <button onclick="event.stopPropagation(); copyRawLink('${item.path}')" title="کپی لینک خام (برای وب)"><i class="fas fa-code"></i></button>
                                  `}
                    </div>
                </div>`;
            }).join('');
        } catch (e) {
            c.innerHTML = e.message === '404' 
                ? '<div class="empty-msg"><i class="fas fa-box-open fa-3x"></i> مسیر خالی یا نامعتبر است</div>'
                : `<div class="empty-msg" style="color:var(--danger)"><i class="fas fa-exclamation-triangle fa-3x"></i> ${e.message}</div>`;
        }
    }

    // Force Download Blob Logic
    async function forceDownload(path, filename) {
        showToast('در حال دریافت و آماده‌سازی فایل...', 'info');
        try {
            const rawUrl = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${path}`;
            const proxyUrl = PROXY_URL + '?url=' + encodeURIComponent(rawUrl);
            
            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error('Network error');
            const blob = await res.blob();
            
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();
            showToast('دانلود آغاز شد', 'success');
        } catch (e) {
            showToast('خطا در دانلود فایل', 'error');
        }
    }

    // لینک دانلود مستقیم (Force Download Link)
    function copyDownloadLink(path) {
        const downloadUrl = `https://github.com/${state.owner}/${state.repo}/raw/${state.branch}/${path}`;
        navigator.clipboard.writeText(downloadUrl).then(() => {
            showToast('لینک دانلود مستقیم کپی شد', 'success');
        }).catch(() => showToast('خطا در کپی لینک', 'error'));
    }

    // لینک خام (Raw Link)
    function copyRawLink(path) {
        const rawUrl = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${path}`;
        navigator.clipboard.writeText(rawUrl).then(() => {
            showToast('لینک خام کپی شد', 'info');
        }).catch(() => showToast('خطا در کپی لینک', 'error'));
    }

    function toggleSelect(path) {
        const exists = state.selected.has(path);
        exists ? state.selected.delete(path) : state.selected.add(path);
        document.querySelector(`[data-path="${path}"]`).classList.toggle('selected', !exists);
        document.querySelector(`[data-path="${path}"] .checkbox`).checked = !exists;
    }

    const getSelected = () => state.files.filter(f => state.selected.has(f.path));

    async function uploadFiles(files) {
        showToast(`در حال آپلود ${files.length} فایل...`, 'info');
        for (let file of files) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const b64 = e.target.result.split(',')[1];
                const path = state.currentPath ? `${state.currentPath}/${file.name}` : file.name;
                try {
                    await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${path}`, {
                        method: 'PUT',
                        body: JSON.stringify({ message: `Upload ${file.name}`, content: b64, branch: state.branch })
                    });
                    showToast(`آپلود ${file.name} موفقیت‌آمیز بود`, 'success');
                    loadCurrentDir(); // Will bust cache and show immediately
                } catch (err) { showToast(`خطا در آپلود ${file.name}`, 'error'); }
            };
            reader.readAsDataURL(file);
        }
    }

    async function deleteSelected() {
        const items = getSelected();
        if (!items.length) return showToast('ابتدا فایلی انتخاب کنید', 'error');
        if (!confirm(`آیا از حذف ${items.length} مورد اطمینان دارید؟`)) return;
        
        showToast('در حال حذف فایل‌ها...', 'info');
        for (let item of items) {
            try {
                await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${item.path}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ message: `Delete ${item.name}`, sha: item.sha, branch: state.branch })
                });
            } catch (e) { console.error(e); }
        }
        showToast('حذف با موفقیت انجام شد', 'success');
        loadCurrentDir(); // Forces fresh load
    }

    function newFolderModal() {
        openModal('<i class="fas fa-folder-plus"></i> ایجاد پوشه جدید', `
            <input type="text" id="fname" placeholder="نام پوشه را وارد کنید..." autofocus>
        `, [{ label: 'ایجاد', class: 'btn', onclick: async () => {
            const name = document.getElementById('fname').value.trim();
            if (!name) return;
            showToast('در حال ایجاد پوشه...', 'info');
            const path = state.currentPath ? `${state.currentPath}/${name}/.gitkeep` : `${name}/.gitkeep`;
            await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${path}`, {
                method: 'PUT', body: JSON.stringify({ message: 'Init folder', content: utf8_to_b64(''), branch: state.branch })
            });
            showToast('پوشه ساخته شد', 'success');
            closeModal(); 
            loadCurrentDir();
        }}, { label: 'انصراف', onclick: closeModal }]);
    }

    async function editSelected() {
        const items = getSelected();
        if (items.length !== 1 || items[0].type === 'dir') return showToast('لطفاً فقط یک فایل متنی انتخاب کنید', 'error');
        const item = items[0];
        
        try {
            showToast('در حال بارگیری محتوای فایل...', 'info');
            const fileData = await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${item.path}?ref=${state.branch}&t=${Date.now()}`);
            const content = b64_to_utf8(fileData.content.replace(/\n/g, ''));
            
            openModal(`<i class="fas fa-pen"></i> ویرایش: ${item.name}`, `
                <textarea id="fileContent" spellcheck="false">${content}</textarea>
            `, [{ label: 'ذخیره فایل', class: 'btn', onclick: async () => {
                showToast('در حال ذخیره تغییرات...', 'info');
                const newContent = utf8_to_b64(document.getElementById('fileContent').value);
                await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${item.path}`, {
                    method: 'PUT',
                    body: JSON.stringify({ message: `Update ${item.name}`, content: newContent, sha: fileData.sha, branch: state.branch })
                });
                showToast('تغییرات با موفقیت ذخیره شد', 'success'); 
                closeModal(); 
                loadCurrentDir();
            }}, { label: 'بستن', onclick: closeModal }]);
        } catch (e) { showToast('خطا در باز کردن فایل (احتمالاً فایل متنی نیست)', 'error'); }
    }

    async function renameSelected() {
        const items = getSelected();
        if (items.length !== 1) return showToast('فقط یک آیتم برای تغییر نام انتخاب کنید', 'error');
        const item = items[0];

        openModal('<i class="fas fa-keyboard"></i> تغییر نام', `
            <input type="text" id="rname" value="${item.name}" autofocus>
        `, [{ label: 'تایید و تغییر', class: 'btn', onclick: async () => {
            const newName = document.getElementById('rname').value.trim();
            if (!newName || newName === item.name) return;
            showToast('در حال پردازش تغییر نام...', 'info');
            try {
                const dir = item.path.substring(0, item.path.lastIndexOf('/') + 1);
                const fileData = await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${item.path}?ref=${state.branch}&t=${Date.now()}`);
                
                await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${dir}${newName}`, {
                    method: 'PUT', body: JSON.stringify({ message: `Rename to ${newName}`, content: fileData.content.replace(/\n/g,''), branch: state.branch })
                });
                await ghFetch(`/repos/${state.owner}/${state.repo}/contents/${item.path}`, {
                    method: 'DELETE', body: JSON.stringify({ message: `Clean old file`, sha: fileData.sha, branch: state.branch })
                });
                showToast('نام فایل تغییر یافت', 'success');
                closeModal(); 
                loadCurrentDir();
            } catch (e) { showToast('خطا در فرآیند تغییر نام', 'error'); }
        }}, { label: 'انصراف', onclick: closeModal }]);
    }

    window.onload = () => {
        if (localStorage.getItem('token')) {
            document.getElementById('token').value = localStorage.getItem('token');
            if(localStorage.getItem('repo')) {
                connect();
            }
        }
    };
</script>
</body>
</html>
