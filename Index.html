<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت فایل گیت‌هاب | File Manager</title>
    <!-- Font Awesome 6 (رایگان) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- JSZip برای ساخت/استخراج zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* نوار بالای اتصال */
        .topbar {
            background: #161b22;
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }
        .topbar .logo {
            font-weight: bold;
            color: #58a6ff;
            font-size: 18px;
            margin-left: 15px;
        }
        .topbar .conn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
            align-items: center;
        }
        .topbar input, .topbar select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            color: #fff;
            font-size: 13px;
            min-width: 120px;
            flex: 1 1 auto;
        }
        .topbar input:focus { border-color: #58a6ff; outline: none; }
        .topbar .btn {
            background: #238636;
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .topbar .btn:hover { background: #2ea043; }
        .topbar .btn-outline {
            background: transparent;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .topbar .btn-outline:hover { background: #1f2937; }
        .topbar .status { font-size: 12px; color: #8b949e; margin-right: 5px; }

        /* بدنه اصلی */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        /* نوار ابزار عمودی (عملیات) */
        .toolbar {
            background: #161b22;
            width: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            border-left: 1px solid #30363d;
            flex-shrink: 0;
            gap: 6px;
        }
        .toolbar .tool-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 22px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toolbar .tool-btn:hover { background: #1f2937; color: #f0f6fc; }
        .toolbar .tool-btn.active { color: #58a6ff; background: #1f2937; }
        .toolbar .separator {
            width: 70%;
            height: 1px;
            background: #30363d;
            margin: 6px 0;
        }
        /* بخش اصلی فایل‌ها */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0d1117;
        }
        .breadcrumb {
            background: #161b22;
            padding: 8px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 14px;
            flex-shrink: 0;
        }
        .breadcrumb a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .sep { color: #8b949e; margin: 0 4px; }
        .breadcrumb .current { color: #f0f6fc; font-weight: 500; }

        /* نمای لیست فایل‌ها */
        .file-list-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .file-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
        }
        .file-item:hover { background: #1f2937; border-color: #58a6ff; }
        .file-item.selected { background: #1f2937; border-color: #58a6ff; box-shadow: 0 0 0 2px #58a6ff66; }
        .file-item .icon {
            font-size: 42px;
            margin-bottom: 6px;
            color: #8b949e;
        }
        .file-item .icon.folder { color: #d29922; }
        .file-item .name {
            font-size: 13px;
            word-break: break-word;
            max-width: 100%;
            line-height: 1.3;
        }
        .file-item .meta {
            font-size: 11px;
            color: #8b949e;
            margin-top: 4px;
        }
        .file-item .checkbox {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            accent-color: #58a6ff;
            cursor: pointer;
        }
        .file-item .actions-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            gap: 6px;
        }
        .file-item .actions-overlay button {
            background: #0d1117cc;
            border: none;
            border-radius: 4px;
            color: #c9d1d9;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .file-item .actions-overlay button:hover { background: #238636; }

        .empty-msg {
            color: #8b949e;
            text-align: center;
            padding: 60px 0;
            font-size: 16px;
        }

        /* مودال عمومی */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 28px 32px;
            max-width: 540px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .modal-box h2 {
            margin-bottom: 16px;
            color: #f0f6fc;
            font-size: 22px;
        }
        .modal-box label {
            display: block;
            margin: 12px 0 4px;
            color: #8b949e;
            font-size: 13px;
        }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
        }
        .modal-box textarea { min-height: 120px; resize: vertical; }
        .modal-box .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal-box .btn-group button {
            padding: 8px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-box .btn-primary { background: #238636; color: #fff; }
        .modal-box .btn-primary:hover { background: #2ea043; }
        .modal-box .btn-secondary { background: #30363d; color: #c9d1d9; }
        .modal-box .btn-secondary:hover { background: #484f58; }
        .modal-box .btn-danger { background: #da3633; color: #fff; }
        .modal-box .btn-danger:hover { background: #f85149; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #238636;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 2000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: none;
            max-width: 90%;
            font-weight: 500;
        }
        .toast.error { background: #da3633; }
        .toast.info { background: #1f6feb; }

        /* واکنش‌گرایی */
        @media (max-width: 768px) {
            .topbar .logo { display: none; }
            .topbar .conn-group input { min-width: 80px; }
            .toolbar { width: 50px; }
            .toolbar .tool-btn { font-size: 18px; width: 38px; height: 38px; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .modal-box { padding: 20px; }
        }
        @media (max-width: 480px) {
            .topbar { flex-direction: column; align-items: stretch; }
            .topbar .conn-group { flex-wrap: wrap; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .file-item .icon { font-size: 32px; }
        }
    </style>
</head>
<body>

<!-- نوار بالایی -->
<div class="topbar">
    <span class="logo"><i class="fas fa-code-branch"></i> GitFM</span>
    <div class="conn-group">
        <input type="password" id="token" placeholder="توکن (ghp_...)" style="min-width:150px;">
        <input type="text" id="repo" placeholder="owner/repo" style="min-width:130px;">
        <input type="text" id="branch" placeholder="branch" value="main" style="min-width:80px;">
        <button class="btn" onclick="connect()"><i class="fas fa-plug"></i> اتصال</button>
        <button class="btn btn-outline" onclick="createRepoModal()"><i class="fas fa-plus"></i> ریپو جدید</button>
        <span class="status" id="connStatus">⛔ غیرمتصل</span>
    </div>
</div>

<!-- بدنه -->
<div class="main">
    <!-- نوار ابزار عمودی -->
    <div class="toolbar" id="toolbar">
        <button class="tool-btn" title="بازگشت به بالا" onclick="goUp()"><i class="fas fa-arrow-up"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" title="پوشه جدید" onclick="newFolderModal()"><i class="fas fa-folder-plus"></i></button>
        <button class="tool-btn" title="آپلود فایل" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-upload"></i></button>
        <input type="file" id="fileUpload" multiple style="display:none" onchange="uploadFiles(this.files)">
        <button class="tool-btn" title="حذف انتخاب‌شده‌ها" onclick="deleteSelected()"><i class="fas fa-trash"></i></button>
        <button class="tool-btn" title="دانلود انتخاب‌شده‌ها (zip)" onclick="downloadZip()"><i class="fas fa-file-archive"></i></button>
        <button class="tool-btn" title="آنزیپ و آپلود" onclick="unzipModal()"><i class="fas fa-file-zipper"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" title="ویرایش فایل متنی" onclick="editSelected()"><i class="fas fa-edit"></i></button>
        <button class="tool-btn" title="تغییر نام" onclick="renameSelected()"><i class="fas fa-i-cursor"></i></button>
        <button class="tool-btn" title="انتقال به..." onclick="moveSelected()"><i class="fas fa-arrows-alt-h"></i></button>
        <div class="separator"></div>
        <button class="tool-btn" title="تازه‌سازی" onclick="loadCurrentDir()"><i class="fas fa-sync"></i></button>
    </div>

    <!-- محتوای فایل‌ها -->
    <div class="content">
        <div class="breadcrumb" id="breadcrumb">
            <i class="fas fa-home" style="color:#58a6ff;"></i>
            <span id="pathDisplay">/</span>
        </div>
        <div class="file-list-wrap" id="fileListWrap">
            <div id="fileContainer" class="file-grid"></div>
        </div>
    </div>
</div>

<!-- مودال‌ها -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
        <h2 id="modalTitle">عنوان</h2>
        <div id="modalBody"></div>
        <div class="btn-group" id="modalButtons"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ====================== وضعیت برنامه ======================
    let state = {
        token: '',
        owner: '',
        repo: '',
        branch: 'main',
        currentPath: '',  // مسیر نسبی از ریشه ریپو (بدون / ابتدا)
        files: [],        // لیست فایل‌های مسیر جاری
        selected: new Set(), // نام‌های فایل انتخاب‌شده
    };

    // ====================== توابع کمکی ======================
    function getConfig() {
        const token = document.getElementById('token').value.trim();
        const repoFull = document.getElementById('repo').value.trim();
        const branch = document.getElementById('branch').value.trim() || 'main';
        if (!token || !repoFull) { showToast('لطفاً توکن و نام ریپو را وارد کنید', 'error'); return null; }
        const parts = repoFull.split('/');
        if (parts.length !== 2) { showToast('فرمت owner/repo صحیح نیست', 'error'); return null; }
        return { token, owner: parts[0], repo: parts[1], branch };
    }

    function getHeaders(token) {
        return { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' };
    }

    async function githubFetch(url, options = {}) {
        const cfg = getConfig();
        if (!cfg) throw new Error('تنظیمات معتبر نیست');
        const headers = getHeaders(cfg.token);
        const res = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
        if (!res.ok) {
            let msg = await res.text().catch(() => '');
            throw new Error(`خطا ${res.status}: ${msg || res.statusText}`);
        }
        return res.json();
    }

    // ساخت لینک خام با توکن (فقط استفاده شخصی)
    function getRawUrl(path) {
        const cfg = getConfig();
        if (!cfg) return '';
        return `https://${cfg.token}@raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`;
    }

    function showToast(msg, type = 'info') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast ' + type;
        t.style.display = 'block';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => t.style.display = 'none', 4000);
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }

    function openModal(title, bodyHTML, buttons = []) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = bodyHTML;
        const btnContainer = document.getElementById('modalButtons');
        btnContainer.innerHTML = '';
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.textContent = b.label;
            btn.className = b.class || 'btn-secondary';
            if (b.onclick) btn.onclick = () => { b.onclick(); };
            btnContainer.appendChild(btn);
        });
        document.getElementById('modalOverlay').classList.add('show');
    }

    // ====================== مدیریت مسیر و ناوبری ======================
    function updateBreadcrumb() {
        const parts = state.currentPath.split('/').filter(p => p);
        let html = `<a onclick="navigateTo('')">ریشه</a>`;
        let cumul = '';
        parts.forEach((p, i) => {
            cumul += p + '/';
            html += `<span class="sep">/</span>`;
            if (i === parts.length - 1) {
                html += `<span class="current">${p}</span>`;
            } else {
                html += `<a onclick="navigateTo('${cumul.slice(0,-1)}')">${p}</a>`;
            }
        });
        document.getElementById('pathDisplay').innerHTML = html;
    }

    function navigateTo(path) {
        state.currentPath = path.replace(/^\/+/, '').replace(/\/+$/, '');
        updateBreadcrumb();
        loadCurrentDir();
    }

    function goUp() {
        const parts = state.currentPath.split('/').filter(p => p);
        parts.pop();
        navigateTo(parts.join('/'));
    }

    // ====================== بارگذاری فایل‌ها ======================
    async function loadCurrentDir() {
        const container = document.getElementById('fileContainer');
        container.innerHTML = '<div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> در حال بارگذاری...</div>';
        const cfg = getConfig();
        if (!cfg) { container.innerHTML = '<div class="empty-msg">لطفاً ابتدا اتصال برقرار کنید</div>'; return; }

        try {
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${state.currentPath}`;
            const data = await githubFetch(url);
            if (!Array.isArray(data)) {
                container.innerHTML = '<div class="empty-msg">این مسیر یک فایل است، نمی‌توان باز کرد</div>';
                return;
            }
            state.files = data;
            renderFiles(data);
            document.getElementById('connStatus').textContent = `✅ ${cfg.owner}/${cfg.repo} : ${cfg.branch}`;
            document.getElementById('connStatus').style.color = '#3fb950';
        } catch (err) {
            container.innerHTML = `<div class="empty-msg" style="color:#f85149;"><i class="fas fa-exclamation-triangle"></i> ${err.message}</div>`;
            showToast(err.message, 'error');
        }
    }

    function renderFiles(files) {
        const container = document.getElementById('fileContainer');
        if (!files || files.length === 0) {
            container.innerHTML = '<div class="empty-msg">📭 پوشه خالی است</div>';
            return;
        }
        let html = '';
        // مرتب‌سازی: پوشه‌ها اول
        const sorted = files.sort((a,b) => {
            if (a.type === 'dir' && b.type !== 'dir') return -1;
            if (a.type !== 'dir' && b.type === 'dir') return 1;
            return a.name.localeCompare(b.name);
        });
        sorted.forEach(item => {
            const isDir = item.type === 'dir';
            const icon = isDir ? '<i class="fas fa-folder icon folder"></i>' : '<i class="fas fa-file icon"></i>';
            const size = isDir ? '' : `${(item.size / 1024).toFixed(1)} KB`;
            const selected = state.selected.has(item.path) ? 'selected' : '';
            const ext = item.name.split('.').pop().toLowerCase();
            const isText = ['txt','md','json','xml','html','css','js','py','java','c','cpp','h','sh','yml','yaml','toml','ini','cfg'].includes(ext);
            html += `
                <div class="file-item ${selected}" data-path="${item.path}" data-type="${item.type}">
                    <input type="checkbox" class="checkbox" ${state.selected.has(item.path) ? 'checked' : ''} 
                           onchange="toggleSelect('${item.path}', this.checked)">
                    <div class="icon">${isDir ? '<i class="fas fa-folder"></i>' : '<i class="fas fa-file"></i>'}</div>
                    <div class="name">${item.name}</div>
                    <div class="meta">${size}</div>
                    <div class="actions-overlay">
                        ${isDir ? `<button onclick="navigateTo('${item.path}')"><i class="fas fa-sign-in-alt"></i></button>` : 
                                  `<button onclick="downloadFile('${item.path}')"><i class="fas fa-download"></i></button>`}
                        ${!isDir && isText ? `<button onclick="editFile('${item.path}')"><i class="fas fa-edit"></i></button>` : ''}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        // انتخاب چندگانه با کلیک روی آیتم (به جز checkbox)
        container.querySelectorAll('.file-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.closest('.actions-overlay')) return;
                const path = this.dataset.path;
                const cb = this.querySelector('.checkbox');
                cb.checked = !cb.checked;
                toggleSelect(path, cb.checked);
            });
        });
    }

    // ====================== انتخاب‌ها ======================
    function toggleSelect(path, checked) {
        if (checked) state.selected.add(path);
        else state.selected.delete(path);
        // به‌روزرسانی کلاس
        document.querySelectorAll('.file-item').forEach(el => {
            if (el.dataset.path === path) {
                el.classList.toggle('selected', checked);
            }
        });
    }

    function getSelectedItems() {
        return state.files.filter(f => state.selected.has(f.path));
    }

    // ====================== عملیات فایل ======================

    // آپلود
    async function uploadFiles(files) {
        const cfg = getConfig();
        if (!cfg) return;
        const path = state.currentPath ? state.currentPath + '/' : '';
        for (let file of files) {
            try {
                showToast(`⏳ آپلود ${file.name} ...`, 'info');
                const reader = new FileReader();
                const content = await new Promise((resolve, reject) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                const filePath = path + file.name;
                const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${filePath}`;
                let sha = null;
                try {
                    const check = await githubFetch(url);
                    if (check && check.sha) sha = check.sha;
                } catch (e) {}
                const payload = {
                    message: `Upload ${file.name}`,
                    content: content,
                    branch: cfg.branch,
                };
                if (sha) payload.sha = sha;
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(await res.text());
                showToast(`✅ ${file.name} آپلود شد`, 'info');
            } catch (err) {
                showToast(`❌ خطا در ${file.name}: ${err.message}`, 'error');
            }
        }
        loadCurrentDir();
    }

    // دانلود یک فایل
    async function downloadFile(path) {
        try {
            const raw = getRawUrl(path);
            const res = await fetch(raw);
            if (!res.ok) throw new Error('خطا در دانلود');
            const blob = await res.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = path.split('/').pop();
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('دانلود شروع شد', 'info');
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    // حذف انتخاب‌شده‌ها
    async function deleteSelected() {
        const items = getSelectedItems();
        if (items.length === 0) { showToast('هیچ فایلی انتخاب نشده', 'error'); return; }
        if (!confirm(`آیا ${items.length} مورد حذف شوند؟`)) return;
        const cfg = getConfig();
        if (!cfg) return;
        for (let item of items) {
            try {
                const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${item.path}`;
                await fetch(url, {
                    method: 'DELETE',
                    headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${item.path}`, sha: item.sha, branch: cfg.branch })
                });
                state.selected.delete(item.path);
                showToast(`🗑️ ${item.name} حذف شد`, 'info');
            } catch (e) {
                showToast(`خطا در حذف ${item.name}: ${e.message}`, 'error');
            }
        }
        loadCurrentDir();
    }

    // پوشه جدید
    function newFolderModal() {
        openModal('پوشه جدید', `
            <label>نام پوشه</label>
            <input type="text" id="newFolderName" placeholder="my-folder">
        `, [
            { label: 'ایجاد', class: 'btn-primary', onclick: async () => {
                const name = document.getElementById('newFolderName').value.trim();
                if (!name) { showToast('نام را وارد کنید', 'error'); return; }
                const cfg = getConfig();
                if (!cfg) return;
                const path = state.currentPath ? state.currentPath + '/' + name : name;
                try {
                    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}/.gitkeep`;
                    await fetch(url, {
                        method: 'PUT',
                        headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `Create folder ${name}`,
                            content: btoa(''),
                            branch: cfg.branch
                        })
                    });
                    showToast(`پوشه ${name} ایجاد شد`, 'info');
                    closeModal();
                    loadCurrentDir();
                } catch (e) {
                    showToast(e.message, 'error');
                }
            }},
            { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
        ]);
    }

    // ویرایش فایل متنی
    async function editFile(path) {
        const cfg = getConfig();
        if (!cfg) return;
        try {
            const raw = getRawUrl(path);
            const res = await fetch(raw);
            if (!res.ok) throw new Error('خطا در خواندن فایل');
            const content = await res.text();
            openModal(`ویرایش: ${path.split('/').pop()}`, `
                <textarea id="editContent">${content}</textarea>
            `, [
                { label: 'ذخیره', class: 'btn-primary', onclick: async () => {
                    const newContent = document.getElementById('editContent').value;
                    const encoded = btoa(unescape(encodeURIComponent(newContent)));
                    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
                    try {
                        const data = await githubFetch(url);
                        await fetch(url, {
                            method: 'PUT',
                            headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Edit ${path}`,
                                content: encoded,
                                sha: data.sha,
                                branch: cfg.branch
                            })
                        });
                        showToast('فایل ذخیره شد', 'info');
                        closeModal();
                        loadCurrentDir();
                    } catch (e) {
                        showToast(e.message, 'error');
                    }
                }},
                { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
            ]);
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    function editSelected() {
        const items = getSelectedItems();
        if (items.length !== 1 || items[0].type === 'dir') {
            showToast('یک فایل متنی را انتخاب کنید', 'error');
            return;
        }
        editFile(items[0].path);
    }

    // تغییر نام
    function renameSelected() {
        const items = getSelectedItems();
        if (items.length !== 1) { showToast('یک فایل یا پوشه انتخاب کنید', 'error'); return; }
        const item = items[0];
        openModal('تغییر نام', `
            <label>نام جدید</label>
            <input type="text" id="newName" value="${item.name}">
        `, [
            { label: 'تغییر', class: 'btn-primary', onclick: async () => {
                const newName = document.getElementById('newName').value.trim();
                if (!newName || newName === item.name) { closeModal(); return; }
                const cfg = getConfig();
                if (!cfg) return;
                try {
                    // مسیر جدید
                    const oldPath = item.path;
                    const dir = oldPath.substring(0, oldPath.lastIndexOf('/') + 1);
                    const newPath = dir + newName;
                    // دریافت محتوای فایل قدیمی
                    const raw = getRawUrl(oldPath);
                    const res = await fetch(raw);
                    if (!res.ok) throw new Error('خطا در خواندن فایل');
                    const blob = await res.blob();
                    const reader = new FileReader();
                    const content = await new Promise((resolve, reject) => {
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(blob);
                    });
                    // آپلود در مسیر جدید
                    const urlNew = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${newPath}`;
                    await fetch(urlNew, {
                        method: 'PUT',
                        headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `Rename ${item.name} to ${newName}`,
                            content: content,
                            branch: cfg.branch
                        })
                    });
                    // حذف فایل قدیمی
                    const urlOld = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${oldPath}`;
                    await fetch(urlOld, {
                        method: 'DELETE',
                        headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: `Delete old ${item.name}`, sha: item.sha, branch: cfg.branch })
                    });
                    showToast('تغییر نام انجام شد', 'info');
                    closeModal();
                    loadCurrentDir();
                } catch (e) {
                    showToast(e.message, 'error');
                }
            }},
            { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
        ]);
    }

    // انتقال
    function moveSelected() {
        const items = getSelectedItems();
        if (items.length === 0) { showToast('حداقل یک فایل انتخاب کنید', 'error'); return; }
        openModal('انتقال به پوشه', `
            <label>مسیر مقصد (نسبی از ریشه ریپو، مثل: folder/sub)</label>
            <input type="text" id="destPath" placeholder="target-folder" value="${state.currentPath}">
        `, [
            { label: 'انتقال', class: 'btn-primary', onclick: async () => {
                const dest = document.getElementById('destPath').value.trim().replace(/^\/+/, '').replace(/\/+$/, '');
                const cfg = getConfig();
                if (!cfg) return;
                for (let item of items) {
                    try {
                        const newPath = dest ? dest + '/' + item.name : item.name;
                        // دانلود محتوا
                        const raw = getRawUrl(item.path);
                        const res = await fetch(raw);
                        if (!res.ok) throw new Error('خطا در خواندن');
                        const blob = await res.blob();
                        const reader = new FileReader();
                        const content = await new Promise((resolve, reject) => {
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.onerror = reject;
                            reader.readAsDataURL(blob);
                        });
                        // آپلود در مقصد
                        const urlNew = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${newPath}`;
                        await fetch(urlNew, {
                            method: 'PUT',
                            headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Move ${item.name}`,
                                content: content,
                                branch: cfg.branch
                            })
                        });
                        // حذف اصلی
                        const urlOld = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${item.path}`;
                        await fetch(urlOld, {
                            method: 'DELETE',
                            headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Delete after move`, sha: item.sha, branch: cfg.branch })
                        });
                        state.selected.delete(item.path);
                    } catch (e) {
                        showToast(`خطا در ${item.name}: ${e.message}`, 'error');
                    }
                }
                closeModal();
                loadCurrentDir();
            }},
            { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
        ]);
    }

    // ====================== زیپ و آنزیپ ======================
    async function downloadZip() {
        const items = getSelectedItems();
        if (items.length === 0) { showToast('چیزی انتخاب نشده', 'error'); return; }
        try {
            const zip = new JSZip();
            for (let item of items) {
                if (item.type === 'dir') continue;
                const raw = getRawUrl(item.path);
                const res = await fetch(raw);
                if (!res.ok) throw new Error(`خطا در ${item.name}`);
                const blob = await res.blob();
                zip.file(item.name, blob);
            }
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipBlob);
            link.download = 'selected.zip';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('فایل zip ساخته شد', 'info');
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    function unzipModal() {
        openModal('آپلود و استخراج zip', `
            <label>فایل zip را انتخاب کنید</label>
            <input type="file" id="zipFileInput" accept=".zip">
            <br><br>
            <label>مسیر مقصد (اختیاری)</label>
            <input type="text" id="unzipDest" placeholder="مسیر در ریپو" value="${state.currentPath}">
        `, [
            { label: 'استخراج', class: 'btn-primary', onclick: async () => {
                const fileInput = document.getElementById('zipFileInput');
                const dest = document.getElementById('unzipDest').value.trim().replace(/^\/+/, '').replace(/\/+$/, '');
                if (!fileInput.files || !fileInput.files[0]) { showToast('فایل zip را انتخاب کنید', 'error'); return; }
                const cfg = getConfig();
                if (!cfg) return;
                try {
                    const zip = await JSZip.loadAsync(fileInput.files[0]);
                    const promises = [];
                    zip.forEach((relativePath, zipEntry) => {
                        if (zipEntry.dir) return;
                        const fullPath = dest ? dest + '/' + relativePath : relativePath;
                        promises.push((async () => {
                            const content = await zipEntry.async('base64');
                            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${fullPath}`;
                            await fetch(url, {
                                method: 'PUT',
                                headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    message: `Unzip ${relativePath}`,
                                    content: content,
                                    branch: cfg.branch
                                })
                            });
                        })());
                    });
                    await Promise.all(promises);
                    showToast('استخراج کامل شد', 'info');
                    closeModal();
                    loadCurrentDir();
                } catch (e) {
                    showToast(e.message, 'error');
                }
            }},
            { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
        ]);
    }

    // ====================== ایجاد ریپو جدید ======================
    function createRepoModal() {
        openModal('ایجاد ریپازیتوری جدید', `
            <label>نام ریپو</label>
            <input type="text" id="newRepoName" placeholder="my-new-repo">
            <label>توضیحات (اختیاری)</label>
            <input type="text" id="newRepoDesc" placeholder="توضیحات کوتاه">
            <label>خصوصی</label>
            <select id="newRepoPrivate"><option value="true">بله</option><option value="false">خیر</option></select>
        `, [
            { label: 'ساخت', class: 'btn-primary', onclick: async () => {
                const name = document.getElementById('newRepoName').value.trim();
                if (!name) { showToast('نام ریپو الزامی است', 'error'); return; }
                const desc = document.getElementById('newRepoDesc').value.trim();
                const isPrivate = document.getElementById('newRepoPrivate').value === 'true';
                const cfg = getConfig();
                if (!cfg) return;
                try {
                    const url = 'https://api.github.com/user/repos';
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { ...getHeaders(cfg.token), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, description: desc, private: isPrivate })
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();
                    showToast(`ریپو ${data.full_name} ساخته شد`, 'info');
                    document.getElementById('repo').value = data.full_name;
                    closeModal();
                    connect();
                } catch (e) {
                    showToast(e.message, 'error');
                }
            }},
            { label: 'انصراف', class: 'btn-secondary', onclick: closeModal }
        ]);
    }

    // ====================== اتصال ======================
    function connect() {
        const cfg = getConfig();
        if (!cfg) return;
        state.token = cfg.token;
        state.owner = cfg.owner;
        state.repo = cfg.repo;
        state.branch = cfg.branch;
        state.currentPath = '';
        state.selected = new Set();
        // ذخیره در localStorage
        ['token','repo','branch'].forEach(id => {
            localStorage.setItem(id, document.getElementById(id).value);
        });
        document.getElementById('connStatus').textContent = '⏳ در حال اتصال...';
        loadCurrentDir();
    }

    // ====================== بارگذاری اولیه ======================
    window.onload = function() {
        ['token','repo','branch'].forEach(id => {
            const val = localStorage.getItem(id);
            if (val) document.getElementById(id).value = val;
        });
        if (document.getElementById('repo').value) connect();
    };

    // کلید ESC برای بستن مودال
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    // کلیک بیرون مودال
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>
